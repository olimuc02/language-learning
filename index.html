<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Language Learning</title>
<meta name="theme-color" content="#1b3a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Français">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='54' font-size='84' text-anchor='middle' dominant-baseline='central'>%F0%9F%8C%8D</text></svg>">
<style>
:root{
  --bg:#faf7f2; --card:#fffdfa; --ink:#1d2433; --muted:#6b7280; --line:#e7e0d5;
  --blue:#1b3a6b; --blue-soft:#e8eefb; --red:#c2382f; --red-soft:#fdecea;
  --gold:#c08a2e; --gold-soft:#fbf1dc; --green:#2e7d5b; --green-soft:#e4f3ec;
  --shadow:0 1px 2px rgba(29,36,51,.05), 0 8px 24px rgba(29,36,51,.06);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.ni{display:none}
h1,h2,h3,h4{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;line-height:1.25;margin:0}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(250,247,242,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.flag{width:26px;height:18px;border-radius:3px;overflow:hidden;display:flex;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.flag i{flex:1}.flag i:nth-child(1){background:#0055a4}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#ef4135}
.brand h1{font-size:19px;letter-spacing:-.01em}
.brand small{display:block;font-family:inherit;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center}
.pill b{color:var(--blue)}
nav{max-width:1080px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:11px 14px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--blue);border-bottom-color:var(--blue)}
main{max-width:1080px;margin:0 auto;padding:26px 20px 90px}
.view{display:none;animation:in .22s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 17px;font-weight:600;font-size:14.5px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f3efe8;filter:none}
.btn.red{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.03em}
.t-blue{background:var(--blue-soft);color:var(--blue)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-gold{background:var(--gold-soft);color:var(--gold)}
.t-green{background:var(--green-soft);color:var(--green)}
.fr{font-weight:600;color:var(--blue);cursor:pointer}
.fr:hover{text-decoration:underline dotted var(--blue);text-underline-offset:3px}
.cmd{font-weight:600;color:var(--blue)}
.say{color:var(--red);font-size:13.5px;font-weight:600;letter-spacing:.01em}
.spk{background:none;border:0;padding:0 3px;font-size:13px;opacity:.4;line-height:1}
.spk:hover{opacity:1}
.speaking{background:var(--gold-soft);border-radius:4px}
.audio-hint{font-size:13.5px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:9px 13px;margin:0 0 14px}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line);margin:18px 0}
input[type=text],input[type=search],select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* ---------- today ---------- */
.hero{background:linear-gradient(150deg,#1b3a6b,#2a5490);color:#fff;border-radius:18px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .eyebrow{color:rgba(255,255,255,.7)}
.hero h2{font-size:27px;color:#fff;margin:2px 0 10px}
.hero p{margin:0;color:rgba(255,255,255,.86);max-width:60ch}
.hero .row{margin-top:18px;position:relative;z-index:1}
.hero .btn{background:#fff;color:var(--blue)}
.hero .btn.ghost{background:rgba(255,255,255,.13);color:#fff;border-color:rgba(255,255,255,.3)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:25px;font-family:Georgia,serif;color:var(--blue);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ---------- lesson body ---------- */
.lesson h3{font-size:19px;margin:22px 0 8px}
.lesson h3:first-child{margin-top:0}
.lesson p{margin:0 0 11px}
.lesson ul,.lesson ol{margin:0 0 12px;padding-left:22px}
.lesson li{margin-bottom:5px}
.box{border-left:3px solid var(--gold);background:var(--gold-soft);padding:12px 15px;border-radius:0 10px 10px 0;margin:14px 0;font-size:14.5px}
.box.blue{border-color:var(--blue);background:var(--blue-soft)}
.box.red{border-color:var(--red);background:var(--red-soft)}
.box.green{border-color:var(--green);background:var(--green-soft)}
.box b{display:block;margin-bottom:3px}

/* ---------- plan ---------- */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.day{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.day:hover{border-color:var(--blue);color:var(--blue)}
.day.done{background:var(--green);border-color:var(--green);color:#fff}
.day.now{box-shadow:0 0 0 2.5px var(--blue);color:var(--blue)}
.day.chk:after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.day.done.chk:after{background:#fff}
.wk{margin-bottom:22px}
.wk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.wk-h h4{font-size:16px}

/* ---------- vocab ---------- */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
.v{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;position:relative}
.v.known{border-color:var(--green);background:var(--green-soft)}
.v .fr{font-size:17px;display:block}
.v .en{font-size:14.5px}
.v .ex{font-size:13px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
.v .ex i{color:var(--blue);font-style:normal;font-weight:600}
.v .tip{font-size:12.5px;margin-top:6px;color:var(--gold);font-weight:600}
.vbtns{position:absolute;top:8px;right:9px;display:flex;gap:1px}
.vbtns button{background:none;border:0;font-size:15px;opacity:.26;padding:2px 4px;line-height:1}
.vbtns button:hover{opacity:.7}
.vbtns button.on{opacity:1}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- flashcards / quiz ---------- */
.fc{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;box-shadow:var(--shadow);cursor:pointer}
.fc .big{font-family:Georgia,serif;font-size:34px;color:var(--blue);margin-bottom:8px}
.fc .sub{font-size:16px}
.q-opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 16px;margin-bottom:9px;font-size:15.5px}
.q-opt:hover{border-color:var(--blue)}
.q-opt.right{background:var(--green-soft);border-color:var(--green);font-weight:600}
.q-opt.wrong{background:var(--red-soft);border-color:var(--red)}
.bar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .3s}

/* ---------- guides ---------- */
.g-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px}
.g{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 19px;text-align:left;box-shadow:var(--shadow)}
.g:hover{border-color:var(--blue)}
.g h4{font-size:16.5px;margin-bottom:5px}
.g p{margin:0;font-size:13.5px;color:var(--muted)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,25,35,.5);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:760px;width:100%;padding:28px 30px;box-shadow:0 24px 60px rgba(0,0,0,.25);position:relative}
.x{position:absolute;top:14px;right:16px;background:none;border:0;font-size:24px;color:var(--muted);line-height:1;padding:4px 8px}
.sheet-head{display:none}
.sheet-body{min-width:0}
.x:hover{color:var(--ink)}

.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:4px;width:17px;height:17px;flex:0 0 auto;accent-color:var(--green)}
.check.done label{text-decoration:line-through;color:var(--muted)}


/* ---------- 20-minute study timer ---------- */
.timer{position:fixed;right:16px;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:80;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(29,36,51,.16);
  width:60px;height:60px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-weight:700;font-size:13px;color:var(--blue);transition:width .2s,height .2s,border-radius .2s;overflow:hidden}
.timer.open{width:min(320px,calc(100vw - 32px));height:auto;display:block;padding:18px 20px;cursor:default;border-radius:18px}
.timer.run{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft),0 8px 30px rgba(29,36,51,.16)}
.timer .clock{font-family:Georgia,serif;font-size:40px;line-height:1;color:var(--blue);text-align:center;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.timer .blk{text-align:center;font-size:14px;font-weight:700;margin-bottom:2px}
.timer .blkd{text-align:center;font-size:12.5px;color:var(--muted);min-height:32px;line-height:1.35}
.tsegs{display:flex;gap:3px;margin:12px 0 10px}
.tsegs i{flex:1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.tsegs i b{position:absolute;inset:0;width:0;background:var(--blue);display:block}
.tsegs i.done b{width:100%}
.timer .trow{display:flex;gap:7px}
.timer .trow button{flex:1;border-radius:9px;padding:9px 0;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.timer .trow button.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.timer .tx{position:absolute;top:8px;right:11px;background:none;border:0;color:var(--muted);font-size:19px;line-height:1;padding:3px 6px}
.timer .mini-note{font-size:12px;color:var(--muted);text-align:center;margin:9px 0 0}

/* ---------- sync ---------- */
#syncpill{cursor:pointer;font-family:inherit}
.synccode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:700;
  letter-spacing:.09em;text-align:center;color:var(--blue);background:var(--blue-soft);
  border-radius:12px;padding:16px 10px;margin:0 0 8px;user-select:all}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:24px;
  bottom:calc(24px + env(safe-area-inset-bottom));z-index:120;background:var(--blue);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 26px rgba(29,36,51,.25);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- homework ---------- */
.hw{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:9px;background:var(--card);display:flex;gap:12px;align-items:flex-start}
.hw.done{background:var(--green-soft);border-color:var(--green)}
.hw input{width:19px;height:19px;flex:0 0 auto;margin-top:3px;accent-color:var(--green)}
.hw h4{font-size:15px;margin:0 0 3px}
.hw p{margin:0;font-size:14px;color:var(--muted)}
.hw.done h4{text-decoration:line-through;color:var(--muted)}

@media print{
  .top,nav,.no-print{display:none!important}
  body{background:#fff}
  .card,.g{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .overlay{position:static;background:none;display:block;padding:0}
  .modal{box-shadow:none;max-width:100%;padding:0}
  .x{display:none}
}
/* ============================================================
   PHONE — bottom tab bar, full-screen sheets, thumb-sized targets
   ============================================================ */
@media(max-width:700px){
  /* --- header shrinks to a single scrollable strip --- */
  .top{border-bottom:1px solid var(--line)}
  .top-in{padding:10px 14px;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .top-in::-webkit-scrollbar{display:none}
  .brand{margin-right:6px;flex:0 0 auto}
  .brand h1{font-size:16px}
  .brand small{font-size:10px}
  .flag{width:22px;height:15px}
  .pill{padding:5px 10px;font-size:11.5px;flex:0 0 auto;white-space:nowrap}
  .pill.hide-phone{display:none}
  #syncpill b{display:none}

  /* --- nav becomes a bottom tab bar --- */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;padding:0;
      background:rgba(250,247,242,.97);backdrop-filter:saturate(180%) blur(14px);
      border-top:1px solid var(--line);border-bottom:0;overflow:visible;
      padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
             padding:8px 2px 7px;border-bottom:0;border-top:2.5px solid transparent;font-size:9.5px;
             letter-spacing:-.01em}
  nav button.on{border-top-color:var(--blue);border-bottom-color:transparent;background:var(--blue-soft)}
  nav button:active{background:var(--blue-soft)}
  .ni{display:block;font-size:19px;line-height:1}
  .nl{font-size:9.5px;font-weight:700;text-transform:uppercase}

  main{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}

  /* --- content --- */
  .card{padding:15px 16px;border-radius:13px}
  .hero{padding:19px;border-radius:15px}
  .hero h2{font-size:21px}
  .hero .row{flex-direction:column}
  .hero .row .btn{width:100%;text-align:center}
  .mini{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:12px 13px}
  .stat b{font-size:22px}
  .vlist,.g-list{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
  .chips{gap:6px}
  .chip{padding:8px 13px;font-size:12.5px}

  /* --- everything tappable gets a real target --- */
  .btn{padding:13px 18px;font-size:15px}
  .btn.sm{padding:10px 14px;font-size:13.5px}
  .q-opt{padding:16px 16px;font-size:15.5px;border-radius:13px}
  .vbtns button{font-size:19px;padding:6px 8px}
  .spk{font-size:16px;padding:4px 6px}
  .check input,.hw input{width:22px;height:22px}
  .fr{padding:1px 0}

  /* --- inputs: 16px stops iOS zooming the page on focus --- */
  input[type=text],input[type=search],select,textarea{font-size:16px;padding:12px 13px}

  /* --- modals become full-screen sheets with an iOS-style header --- */
  .overlay{padding:0;align-items:stretch;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
           background:var(--bg);backdrop-filter:none}
  .modal{border-radius:0;min-height:100dvh;padding:0;max-width:100%;box-shadow:none;background:var(--bg)}
  .x{display:none}
  .sheet-head{display:flex;position:sticky;top:0;z-index:8;align-items:center;gap:12px;
    padding:calc(9px + env(safe-area-inset-top)) 15px 10px;
    background:rgba(250,247,242,.93);backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line)}
  .sheet-head b{flex:1;min-width:0;font-size:15px;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet-done{border:0;background:var(--blue);color:#fff;border-radius:999px;
    padding:8px 17px;font-size:14.5px;font-weight:700;flex:0 0 auto}
  .sheet-done:active{opacity:.75}
  .sheet-body{padding:18px 15px calc(48px + env(safe-area-inset-bottom))}
  .modal h2{font-size:23px;line-height:1.2}

  /* --- every table row becomes its own card --- */
  .stack{display:block;width:100%;border-collapse:separate}
  .stack thead,.stack tr.hrow{display:none}
  .stack tbody{display:block}
  .stack tr{display:block;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:12px 14px;margin:0 0 9px}
  .stack tr:last-child{margin-bottom:0}
  .stack td,.stack th{display:block;border:0;padding:3px 0;text-align:left;
    white-space:normal;min-width:0;font-size:15px}
  .stack td:empty{display:none}
  .stack td[data-l]:before{content:attr(data-l);display:block;font-size:10px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
  .stack th.rowlab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--blue);margin-bottom:3px}
  .stack .fr{font-size:18px;display:inline-block}
  .stack .say{display:inline-block;margin-left:6px}
  .stack td.fr{font-size:19px}

  .lesson h3{font-size:18px;margin:26px 0 9px}
  .lesson p,.lesson li{font-size:15.5px}
  .box{font-size:14.5px;padding:13px 15px;border-radius:0 12px 12px 0}
  .lesson ul,.lesson ol{padding-left:19px}

  /* --- timer clears the tab bar --- */
  .timer{bottom:calc(74px + env(safe-area-inset-bottom));right:13px;width:56px;height:56px}
  .timer.open{width:calc(100vw - 26px)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .synccode{font-size:22px;letter-spacing:.06em}
}

/* hover styles do nothing on a touchscreen — use press states instead */
@media(hover:none){
  .btn:hover,.chip:hover,.q-opt:hover,.g:hover,.day:hover{filter:none}
  .fr:hover{text-decoration:none}
  .btn:active{transform:scale(.97)}
  .q-opt:active,.g:active,.v:active{background:var(--blue-soft)}
}

// --- time & numbers
["un, deux, trois","an, DUH, TRWA","one, two, three","time","Un, deux, trois — allez !","One, two, three — go!","",4],
["quatre, cinq, six","KA-truh, SANK, SEESS","four, five, six","time","Il est six heures.","It's six o'clock.","",4],

// --- home & everyday
["la maison","la meh-ZOHN","house / home","home","Je rentre à la maison.","I'm going home.","'mansion'",19],
["l'appartement","la-par-tuh-MAHN","apartment","home","Mon appartement est petit.","My apartment is small.","",19],

// --- core verbs
["être","ET-ruh","to be","verbs","Je suis américain.","I am American.","irregular — memorize it",8],

["vouloir","voo-LWAHR","to want","verbs","Je veux un café.","I want a coffee.","'je voudrais' is politer",22],

["boire","BWAHR","to drink","verbs","Je bois de l'eau.","I drink water.","",22],
["habiter","a-bee-TAY","to live (somewhere)","verbs","J'habite à Chicago.","I live in Chicago.","'habitat'",15],
["prendre","PRAHN-druh","to take / to have (food)","verbs","Je prends un café.","I'll have a coffee.","used for ordering",22],

["dire","DEER","to say","verbs","Qu'est-ce que tu dis ?","What are you saying?","",47],

["comprendre","kohn-PRAHN-druh","to understand","verbs","Je comprends !","I understand!","'comprehend'",40],

{id:"pron", title:"Pronunciation Cheat Sheet", sub:"Every French sound, with an English trick for each", tag:"Day 1+", body:`
<h3>The four hard sounds</h3>
<table>
<tr><th>Sound</th><th>How to make it</th><th>Example</th></tr>
<tr><td><b>Nasal</b> on/an/en/in/un</td><td>Say the vowel with air going through your <i>nose</i>. The N is never pronounced.</td><td class="fr">bon <span class="say">bohn</span> · vin <span class="say">van</span></td></tr>
<tr><td><b>u</b></td><td>Say "ee", then round your lips into a whistle. Tongue does not move.</td><td class="fr">tu <span class="say">tü</span> · salut <span class="say">sa-LÜ</span></td></tr>
<tr><td><b>r</b></td><td>Back of the throat, gentle gargle. Never the English "rrr".</td><td class="fr">merci · Paris</td></tr>
<tr><td><b>j / g+e,i</b></td><td>Like the "s" in <i>measure</i>. Never English "j".</td><td class="fr">je <span class="say">zhuh</span> · rouge</td></tr>
</table>

<h3>Letters that behave differently</h3>
<table>
<tr><th>Spelling</th><th>Sounds like</th><th>Example</th></tr>
<tr><td>ou</td><td>oo (as in food)</td><td class="fr">bonjour, vous</td></tr>
<tr><td>oi</td><td>wah</td><td class="fr">moi <span class="say">mwah</span>, trois</td></tr>
<tr><td>ai / ei</td><td>eh</td><td class="fr">français, mais</td></tr>
<tr><td>au / eau</td><td>oh</td><td class="fr">eau <span class="say">oh</span>, beau</td></tr>
<tr><td>eu</td><td>uh (lips rounded)</td><td class="fr">deux, peu</td></tr>
<tr><td>ch</td><td>sh</td><td class="fr">chat <span class="say">sha</span></td></tr>
<tr><td>gn</td><td>ny (as in canyon)</td><td class="fr">montagne</td></tr>
<tr><td>ill</td><td>ee-y</td><td class="fr">fille <span class="say">FEE-yuh</span></td></tr>
<tr><td>qu</td><td>k (never "kw")</td><td class="fr">qui <span class="say">kee</span></td></tr>
<tr><td>h</td><td>always silent</td><td class="fr">hôtel <span class="say">oh-TEL</span></td></tr>
<tr><td>é</td><td>ay</td><td class="fr">café</td></tr>
<tr><td>è / ê</td><td>eh</td><td class="fr">père, être</td></tr>
<tr><td>ç</td><td>s</td><td class="fr">ça <span class="say">sa</span></td></tr>
</table>

<h3>Silent letters — the big rule</h3>
<p>Final consonants are usually <b>silent</b>: <span class="fr">Paris</span> = <span class="say">pa-REE</span>, <span class="fr">petit</span> = <span class="say">puh-TEE</span>, <span class="fr">vous</span> = <span class="say">voo</span>.</p>
<div class="box"><b>The CaReFuL rule</b>The letters in <b>C, R, F, L</b> usually ARE pronounced at the end of a word: sa<b>c</b>, bonjou<b>r</b>, neu<b>f</b>, hôte<b>l</b>. Everything else, assume silent.</div>
<p>Also silent: final <b>-e</b> (<span class="fr">table</span> = <span class="say">TAH-bluh</span>, barely), final <b>-s</b> of plurals (<span class="fr">les amis</span> sounds the same as one ami, apart from the liaison).</p>

<h3>Liaison — words gluing together</h3>
<p>When a silent final consonant meets a word starting with a vowel, it wakes up and joins:</p>
<ul>
<li><span class="fr">vous êtes</span> → <span class="say">voo ZET</span> (the S becomes a Z)</li>
<li><span class="fr">les amis</span> → <span class="say">lay za-MEE</span></li>
<li><span class="fr">c'est un</span> → <span class="say">say tan</span></li>
</ul>
<p>This is why spoken French sounds like one long word. It's not you — it's genuinely glued together.</p>

<h3>Stress</h3>
<p>English stresses one syllable hard (<b>PHO</b>-to-graph). French stresses the <b>last</b> syllable of a phrase, lightly and evenly. Flatten your delivery and push slightly at the end: <span class="fr">un café au LAIT</span>.</p>
`},

{id:"survive", title:"The 20 Phrases That Get You Through France", sub:"If you learn nothing else, learn these", tag:"Emergency sheet", body:`
<p>Print this. It's genuinely enough to survive a two-week trip.</p>
<table>
<tr><th>French</th><th>Say it</th><th>Means</th></tr>
<tr><td class="fr">Bonjour / Bonsoir</td><td class="say">bohn-ZHOOR / bohn-SWAHR</td><td>Hello / Good evening</td></tr>
<tr><td class="fr">Merci beaucoup</td><td class="say">mehr-SEE boh-KOO</td><td>Thank you very much</td></tr>
<tr><td class="fr">S'il vous plaît</td><td class="say">seel voo PLEH</td><td>Please</td></tr>
<tr><td class="fr">Excusez-moi</td><td class="say">ex-kü-zay MWAH</td><td>Excuse me</td></tr>
<tr><td class="fr">Pardon</td><td class="say">par-DOHN</td><td>Sorry / coming through</td></tr>
<tr><td class="fr">Parlez-vous anglais ?</td><td class="say">par-lay voo ahn-GLEH</td><td>Do you speak English?</td></tr>

<tr><td class="fr">Je voudrais…</td><td class="say">zhuh voo-DREH</td><td>I would like…</td></tr>
<tr><td class="fr">C'est combien ?</td><td class="say">say kohn-bee-AN</td><td>How much is it?</td></tr>
<tr><td class="fr">L'addition, s'il vous plaît</td><td class="say">la-dee-see-OHN</td><td>The check, please</td></tr>

</table>
<div class="box blue"><b>Emergency numbers in France</b>112 (all emergencies, works EU-wide) · 15 (ambulance) · 17 (police) · 18 (fire)</div>

{id:"etre", title:"Être &amp; Avoir — Full Tables", sub:"The two verbs everything else is built on", tag:"Days 8–9", body:`
<h3>ÊTRE — to be</h3>
<table>
<tr><th>French</th><th>Say it</th><th>English</th></tr>
<tr><td class="fr">je suis</td><td class="say">zhuh SWEE</td><td>I am</td></tr>
<tr><td class="fr">tu es</td><td class="say">tü EH</td><td>you are (friend)</td></tr>
<tr><td class="fr">il / elle est</td><td class="say">eel / ell EH</td><td>he / she is</td></tr>
<tr><td class="fr">nous sommes</td><td class="say">noo SOM</td><td>we are</td></tr>
<tr><td class="fr">vous êtes</td><td class="say">voo ZET</td><td>you are (formal/plural)</td></tr>
<tr><td class="fr">ils / elles sont</td><td class="say">eel / ell SOHN</td><td>they are</td></tr>
</table>
<p><b>Used for:</b> identity, nationality, jobs, permanent descriptions, location.<br>
<span class="fr">Je suis américain. Je suis fatigué. Il est à Paris.</span></p>

<h3>AVOIR — to have</h3>
<table>
<tr><th>French</th><th>Say it</th><th>English</th></tr>
<tr><td class="fr">j'ai</td><td class="say">ZHAY</td><td>I have</td></tr>
<tr><td class="fr">tu as</td><td class="say">tü A</td><td>you have</td></tr>
<tr><td class="fr">il / elle a</td><td class="say">eel A</td><td>he / she has</td></tr>
<tr><td class="fr">nous avons</td><td class="say">noo za-VOHN</td><td>we have</td></tr>
<tr><td class="fr">vous avez</td><td class="say">voo za-VAY</td><td>you have</td></tr>
<tr><td class="fr">ils / elles ont</td><td class="say">eel ZOHN</td><td>they have</td></tr>
</table>
<div class="box red"><b>Watch out</b><span class="fr">ils sont</span> (they are) vs <span class="fr">ils ont</span> (they have) — the only difference in speech is a Z sound: <span class="say">eel SOHN</span> vs <span class="say">eel ZOHN</span>. Learners mix these up constantly.</div>

<h3>Where French uses AVOIR but English uses "be"</h3>
<table>
<tr><th>French (literally)</th><th>Real meaning</th></tr>
<tr><td class="fr">J'ai 40 ans</td><td>I'm 40 (I <i>have</i> 40 years)</td></tr>
<tr><td class="fr">J'ai faim</td><td>I'm hungry (I have hunger)</td></tr>
<tr><td class="fr">J'ai soif</td><td>I'm thirsty</td></tr>
<tr><td class="fr">J'ai froid / chaud</td><td>I'm cold / hot</td></tr>
<tr><td class="fr">J'ai peur</td><td>I'm afraid</td></tr>
<tr><td class="fr">J'ai raison / tort</td><td>I'm right / wrong</td></tr>
<tr><td class="fr">J'ai besoin de…</td><td>I need…</td></tr>
</table>
<p>Saying <span class="fr">je suis 40</span> is a classic beginner error and sounds very strange to a French ear.</p>
`},

{id:"gender", title:"Gender &amp; Articles — Coping Strategies", sub:"Le, la, un, une, du, des — the whole system", tag:"Day 5+", body:`
<h3>The situation</h3>
<p>Every French noun is masculine or feminine. A table is feminine. A book is masculine. There is no logic. English has nothing like this — the closest thing is remembering that a ship is "she".</p>
<div class="box green"><b>The only rule that matters</b>Never learn a noun alone. Learn <span class="fr">le pain</span>, not <i>pain</i>. Learn <span class="fr">la table</span>, not <i>table</i>. The article is part of the word.</div>

<h3>The four article types</h3>
<table>
<tr><th></th><th>Masculine</th><th>Feminine</th><th>Plural</th></tr>
<tr><th>the</th><td class="fr">le pain</td><td class="fr">la table</td><td class="fr">les amis</td></tr>
<tr><th>a / an</th><td class="fr">un café</td><td class="fr">une bière</td><td class="fr">des cafés (some)</td></tr>
<tr><th>some / any</th><td class="fr">du pain</td><td class="fr">de la viande</td><td class="fr">des légumes</td></tr>
<tr><th>before a vowel</th><td colspan="3" class="fr">l'homme, l'eau, l'ami (le/la both shrink to l')</td></tr>
</table>

<h3>Patterns that predict gender (~80% reliable)</h3>
<p><b>Usually feminine</b> — endings: <b>-tion, -sion, -té, -ée, -ie, -ure, -ette, -ance, -ence</b><br>
<span class="fr">la nation, la liberté, la journée, la boulangerie, la voiture</span></p>
<p><b>Usually masculine</b> — endings: <b>-age, -ment, -eau, -isme, -oir, -er, -in, -on</b><br>
<span class="fr">le fromage, le gouvernement, le bureau, le soir, le vin</span></p>
<p>Exceptions exist (<span class="fr">la page, la plage, l'eau</span> is feminine!) but this gets you most of the way.</p>

<h3>Contractions you must know</h3>
<table>
<tr><td class="fr">à + le = <b>au</b></td><td>Je vais <b>au</b> marché — I'm going to the market</td></tr>
<tr><td class="fr">à + les = <b>aux</b></td><td>Je parle <b>aux</b> enfants</td></tr>
<tr><td class="fr">de + le = <b>du</b></td><td>Je viens <b>du</b> bureau — I'm coming from the office</td></tr>
<tr><td class="fr">de + les = <b>des</b></td><td>La clé <b>des</b> chambres</td></tr>
</table>
<p><span class="fr">à la</span> and <span class="fr">de la</span> never contract: <span class="fr">à la maison, de la viande</span>.</p>

<h3>The "some" rule English doesn't have</h3>
<p>In English "I eat bread" is fine. In French you <b>must</b> say "I eat <i>some</i> bread":</p>
<ul>
<li>✅ <span class="fr">Je mange du pain.</span> — I eat bread.</li>
<li>❌ <span class="fr">Je mange pain.</span> — sounds broken.</li>
</ul>
<p><b>But after a negative, it all becomes <span class="fr">de</span>:</b><br>
<span class="fr">Je mange du pain</span> → <span class="fr">Je ne mange <b>pas de</b> pain.</span><br>
<span class="fr">J'ai une voiture</span> → <span class="fr">Je n'ai <b>pas de</b> voiture.</span></p>
`},

{id:"verbs", title:"Verb Conjugation Master Sheet", sub:"Present, past, future — all in one place", tag:"Days 15+", body:`
<h3>Regular -ER verbs (about 90% of all French verbs)</h3>
<p>Take <span class="fr">parler</span> (to speak). Chop off <b>-er</b> → <b>parl</b>. Add:</p>
<table>
<tr><td class="fr">je parl<b>e</b></td><td class="say">zhuh PARL</td><td>I speak</td></tr>
<tr><td class="fr">tu parl<b>es</b></td><td class="say">tü PARL</td><td>you speak</td></tr>
<tr><td class="fr">il/elle parl<b>e</b></td><td class="say">eel PARL</td><td>he/she speaks</td></tr>
<tr><td class="fr">nous parl<b>ons</b></td><td class="say">noo par-LOHN</td><td>we speak</td></tr>
<tr><td class="fr">vous parl<b>ez</b></td><td class="say">voo par-LAY</td><td>you speak</td></tr>
<tr><td class="fr">ils/elles parl<b>ent</b></td><td class="say">eel PARL</td><td>they speak</td></tr>
</table>
<div class="box green"><b>Great news</b>Four of those six are pronounced <i>identically</i> — <span class="say">PARL</span>. The -e, -es, -e, -ent endings are all silent. You only really learn two new sounds: -ons and -ez.</div>
<p>Same pattern: <span class="fr">aimer, habiter, travailler, manger, chercher, trouver, donner, écouter, regarder, jouer</span> — hundreds more.</p>

<h3>The present tense means three English things</h3>
<p><span class="fr">Je parle français</span> = "I speak French" / "I am speaking French" / "I do speak French". French has no separate "-ing" tense. This makes life easier.</p>

<h3>The past tense (passé composé)</h3>
<p><b>avoir + past participle.</b> That's the whole formula.</p>
<table>
<tr><th>Verb type</th><th>Participle</th><th>Example</th></tr>
<tr><td>-er verbs</td><td>-é</td><td class="fr">J'ai parlé — I spoke</td></tr>
<tr><td>-ir verbs</td><td>-i</td><td class="fr">J'ai fini — I finished</td></tr>
<tr><td>-re verbs</td><td>-u</td><td class="fr">J'ai vendu — I sold</td></tr>
</table>
<p><b>The irregular ones worth memorizing now:</b></p>
<table>
<tr><td class="fr">avoir → eu</td><td class="fr">être → été</td><td class="fr">faire → fait</td></tr>
<tr><td class="fr">voir → vu</td><td class="fr">prendre → pris</td><td class="fr">mettre → mis</td></tr>
<tr><td class="fr">dire → dit</td><td class="fr">écrire → écrit</td><td class="fr">lire → lu</td></tr>
<tr><td class="fr">boire → bu</td><td class="fr">pouvoir → pu</td><td class="fr">vouloir → voulu</td></tr>
</table>

<h3>The 16 verbs that use ÊTRE instead</h3>
<p>Mostly verbs of movement. Memory trick: <b>DR &amp; MRS VANDERTRAMP</b>.</p>
<p class="fr">Devenir, Revenir, Monter, Rester, Sortir, Venir, Aller, Naître, Descendre, Entrer, Rentrer, Tomber, Retourner, Arriver, Mourir, Partir</p>
<p><span class="fr">Je <b>suis</b> allé au marché.</span> — I went to the market.<br>
With être, the participle agrees: a woman says <span class="fr">je suis allé<b>e</b></span>.</p>

<h3>The imparfait (used to / was doing)</h3>
<p>Take the <b>nous</b> form of the present, drop <b>-ons</b>, add: <b>-ais, -ais, -ait, -ions, -iez, -aient</b>.</p>
<p><span class="fr">nous parlons</span> → <span class="fr">je parlais</span> (I used to speak / I was speaking)</p>
<p>Only one irregular in the whole language: <span class="fr">être → j'étais</span>.</p>

<h3>Which past tense? The photo vs film rule</h3>
<ul>
<li><b>Passé composé</b> = a <i>photo</i>. One completed event. "I ate. I arrived. He called."</li>
<li><b>Imparfait</b> = a <i>film</i> running in the background. Descriptions, weather, feelings, habits. "It was raining. I was tired. I used to go every Sunday."</li>
</ul>
<p><span class="fr">Il <b>pleuvait</b> quand je <b>suis arrivé</b>.</span> — It was raining (film) when I arrived (photo).</p>

<h3>The future — the easy way</h3>
<p><b>aller + infinitive.</b> Exactly like English "going to".</p>
<p><span class="fr">Je vais manger.</span> — I'm going to eat.<br>
<span class="fr">On va partir demain.</span> — We're going to leave tomorrow.</p>
<p>This covers 90% of spoken future. The "real" future tense (<span class="fr">je mangerai</span>) comes on Day 64.</p>
`},

{id:"questions", title:"Questions &amp; Negation", sub:"Asking things, and saying no", tag:"Days 10–11", body:`
<h3>Three ways to ask a question — all correct</h3>
<table>
<tr><th>Style</th><th>How</th><th>Example</th></tr>
<tr><td><b>1. Casual</b><br>(most spoken)</td><td>Say a statement, raise your voice at the end</td><td class="fr">Tu parles français ?</td></tr>
<tr><td><b>2. Neutral</b><br>(safest)</td><td>Put <b>Est-ce que</b> in front</td><td class="fr">Est-ce que tu parles français ?</td></tr>
<tr><td><b>3. Formal</b><br>(written, polite)</td><td>Flip the verb and subject</td><td class="fr">Parlez-vous français ?</td></tr>
</table>
<div class="box blue"><b>Use #2 as your default</b><span class="fr">Est-ce que</span> (<span class="say">ess-kuh</span>) works in front of literally any statement and is always correct. It's the beginner's best friend.</div>

<h3>Question words</h3>
<table>
<tr><td class="fr">qui</td><td class="say">kee</td><td>who</td><td class="fr">Qui est-ce ?</td></tr>
<tr><td class="fr">quoi / que</td><td class="say">kwa / kuh</td><td>what</td><td class="fr">Qu'est-ce que c'est ?</td></tr>
<tr><td class="fr">où</td><td class="say">oo</td><td>where</td><td class="fr">Où est la gare ?</td></tr>
<tr><td class="fr">quand</td><td class="say">kahn</td><td>when</td><td class="fr">Quand est-ce que tu pars ?</td></tr>
<tr><td class="fr">pourquoi</td><td class="say">poor-KWA</td><td>why</td><td class="fr">Pourquoi pas ?</td></tr>
<tr><td class="fr">comment</td><td class="say">ko-MAHN</td><td>how</td><td class="fr">Comment ça va ?</td></tr>
<tr><td class="fr">combien</td><td class="say">kohn-bee-AN</td><td>how much</td><td class="fr">C'est combien ?</td></tr>
<tr><td class="fr">quel / quelle</td><td class="say">kell</td><td>which / what</td><td class="fr">Quelle heure est-il ?</td></tr>
</table>
<p><b>The one to memorize whole:</b> <span class="fr">Qu'est-ce que c'est ?</span> <span class="say">kess-kuh SAY</span> = "What is that?" Don't analyze it, just learn it as a chunk.</p>

<h3>Negation — the sandwich</h3>
<p>French wraps the verb in two pieces: <b>ne … pas</b>.</p>
<ul>
<li><span class="fr">Je parle</span> → <span class="fr">Je <b>ne</b> parle <b>pas</b>.</span> — I don't speak.</li>
<li><span class="fr">C'est bon</span> → <span class="fr">Ce <b>n'</b>est <b>pas</b> bon.</span> — It's not good.</li>
</ul>
<div class="box"><b>In real speech, the "ne" disappears</b>French people say <span class="fr">je sais pas</span>, not <span class="fr">je ne sais pas</span>. <span class="fr">C'est pas bon.</span> Dropping "ne" is normal and casual — but keep it in writing.</div>

<h3>Other negatives — same sandwich, different filling</h3>
<table>
<tr><td class="fr">ne … jamais</td><td>never</td><td class="fr">Je ne fume jamais.</td></tr>
<tr><td class="fr">ne … plus</td><td>not anymore</td><td class="fr">Je ne travaille plus.</td></tr>
<tr><td class="fr">ne … rien</td><td>nothing</td><td class="fr">Je ne vois rien.</td></tr>
<tr><td class="fr">ne … personne</td><td>nobody</td><td class="fr">Je ne connais personne.</td></tr>
<tr><td class="fr">ne … pas encore</td><td>not yet</td><td class="fr">Je n'ai pas encore mangé.</td></tr>
</table>
`},

{id:"numbers", title:"Numbers, Time &amp; Dates", sub:"Including the notorious French 70–99", tag:"Days 4, 18, 29", body:`
<h3>0–20</h3>
<table>
<tr><td class="fr">0 zéro</td><td class="fr">1 un</td><td class="fr">2 deux</td><td class="fr">3 trois</td><td class="fr">4 quatre</td></tr>
<tr><td class="fr">5 cinq</td><td class="fr">6 six</td><td class="fr">7 sept</td><td class="fr">8 huit</td><td class="fr">9 neuf</td></tr>
<tr><td class="fr">10 dix</td><td class="fr">11 onze</td><td class="fr">12 douze</td><td class="fr">13 treize</td><td class="fr">14 quatorze</td></tr>
<tr><td class="fr">15 quinze</td><td class="fr">16 seize</td><td class="fr">17 dix-sept</td><td class="fr">18 dix-huit</td><td class="fr">19 dix-neuf</td></tr>
<tr><td class="fr">20 vingt</td><td colspan="4" class="say">van — the G and T are silent</td></tr>
</table>

<h3>20–69 — completely normal</h3>
<p class="fr">20 vingt · 30 trente · 40 quarante · 50 cinquante · 60 soixante</p>
<p>Then just add: <span class="fr">vingt-et-un</span> (21), <span class="fr">vingt-deux</span> (22), <span class="fr">trente-cinq</span> (35)…</p>

<h3>70–99 — the famous madness</h3>
<div class="box red"><b>Brace yourself</b>French stops having new words at 60 and starts doing arithmetic instead.</div>
<table>
<tr><th>Number</th><th>French</th><th>Literally</th></tr>
<tr><td>70</td><td class="fr">soixante-dix</td><td>sixty-ten</td></tr>
<tr><td>71</td><td class="fr">soixante-et-onze</td><td>sixty-and-eleven</td></tr>
<tr><td>75</td><td class="fr">soixante-quinze</td><td>sixty-fifteen</td></tr>
<tr><td>80</td><td class="fr">quatre-vingts</td><td>four-twenties</td></tr>
<tr><td>85</td><td class="fr">quatre-vingt-cinq</td><td>four-twenties-five</td></tr>
<tr><td>90</td><td class="fr">quatre-vingt-dix</td><td>four-twenties-ten</td></tr>
<tr><td>95</td><td class="fr">quatre-vingt-quinze</td><td>four-twenties-fifteen</td></tr>
<tr><td>99</td><td class="fr">quatre-vingt-dix-neuf</td><td>four-twenties-ten-nine</td></tr>
</table>
<p><i>(In Belgium and Switzerland they sensibly say</i> <span class="fr">septante</span> <i>and</i> <span class="fr">nonante</span><i>. France does not.)</i></p>

<h3>Big numbers</h3>
<p class="fr">100 cent · 200 deux cents · 1000 mille · 1 000 000 un million</p>
<p>French uses a <b>comma</b> for decimals and a space for thousands: <b>3,50 €</b> = three euros fifty, said <span class="fr">trois euros cinquante</span>.</p>

<h3>Telling time</h3>
<p><b>Question:</b> <span class="fr">Quelle heure est-il ?</span> <span class="say">kell UHR ay-TEEL</span></p>
<table>
<tr><td>2:00</td><td class="fr">Il est deux heures</td></tr>
<tr><td>2:15</td><td class="fr">Il est deux heures et quart</td></tr>
<tr><td>2:30</td><td class="fr">Il est deux heures et demie</td></tr>
<tr><td>2:45</td><td class="fr">Il est trois heures moins le quart</td><td class="muted">"three minus a quarter"</td></tr>
<tr><td>2:10</td><td class="fr">Il est deux heures dix</td></tr>
<tr><td>noon / midnight</td><td class="fr">midi / minuit</td></tr>
</table>
<p>Officially France uses the 24-hour clock: <b>19h30</b> = <span class="fr">dix-neuf heures trente</span>. In casual speech people still say "sept heures et demie du soir".</p>

<h3>Days &amp; months</h3>
<p class="fr">lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche</p>
<p class="fr">janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre</p>
<div class="box"><b>No capital letters</b>Days and months are lowercase in French. And a date goes day-first: <b>12/08/2026</b> means 12 August.</div>
`},

{id:"traps", title:"False Friends &amp; Classic Mistakes", sub:"The traps English speakers fall into", tag:"All levels", body:`
<h3>False friends — words that look English but aren't</h3>
<table>
<tr><th>French</th><th>Actually means</th><th>NOT</th></tr>
<tr><td class="fr">l'entrée</td><td>starter / appetizer</td><td>main course</td></tr>
<tr><td class="fr">actuellement</td><td>currently, right now</td><td>actually</td></tr>
<tr><td class="fr">éventuellement</td><td>possibly, if need be</td><td>eventually</td></tr>
<tr><td class="fr">attendre</td><td>to wait for</td><td>to attend</td></tr>
<tr><td class="fr">assister à</td><td>to attend</td><td>to assist</td></tr>
<tr><td class="fr">sensible</td><td>sensitive</td><td>sensible</td></tr>
<tr><td class="fr">la librairie</td><td>bookshop</td><td>library (= la bibliothèque)</td></tr>
<tr><td class="fr">la monnaie</td><td>change (coins)</td><td>money (= l'argent)</td></tr>
<tr><td class="fr">le collège</td><td>middle school</td><td>college</td></tr>
<tr><td class="fr">passer un examen</td><td>to take an exam</td><td>to pass it (= réussir)</td></tr>
<tr><td class="fr">demander</td><td>to ask</td><td>to demand</td></tr>
<tr><td class="fr">rester</td><td>to stay</td><td>to rest</td></tr>
<tr><td class="fr">blesser</td><td>to injure</td><td>to bless</td></tr>
<tr><td class="fr">le pain</td><td>bread</td><td>pain (= la douleur)</td></tr>
<tr><td class="fr">le préservatif</td><td>condom</td><td>preservative — be careful with this one</td></tr>
</table>

<h3>The mistakes almost every English speaker makes</h3>
<table>
<tr><th>❌ Wrong</th><th>✅ Right</th><th>Why</th></tr>
<tr><td class="fr">Je suis 40 ans</td><td class="fr">J'ai 40 ans</td><td>Age uses <i>avoir</i>, not <i>être</i></td></tr>
<tr><td class="fr">Je suis chaud</td><td class="fr">J'ai chaud</td><td>"Je suis chaud" means you're… aroused</td></tr>
<tr><td class="fr">Je mange pain</td><td class="fr">Je mange du pain</td><td>"Some" is mandatory in French</td></tr>
<tr><td class="fr">Je visite mon ami</td><td class="fr">Je rends visite à mon ami</td><td><i>visiter</i> is for places, not people</td></tr>
<tr><td class="fr">Je suis en train</td><td class="fr">Je suis dans le train</td><td>"en train de" means "in the middle of doing"</td></tr>
<tr><td class="fr">C'est bon ?</td><td class="fr">C'est bien ?</td><td><i>bon</i> = tastes/feels good; <i>bien</i> = good in quality</td></tr>
<tr><td class="fr">Je sais Paris</td><td class="fr">Je connais Paris</td><td><i>savoir</i> = know a fact; <i>connaître</i> = know a person/place</td></tr>
<tr><td class="fr">un grand homme</td><td class="fr">un homme grand</td><td>Before the noun = "a great man"; after = "a tall man"</td></tr>
</table>

<h3>Adjective placement</h3>
<p>Most French adjectives go <b>after</b> the noun: <span class="fr">une voiture rouge</span> (a red car), <span class="fr">un homme intéressant</span>.</p>
<p>A short list goes <b>before</b> — remember <b>BAGS</b>: <b>B</b>eauty, <b>A</b>ge, <b>G</b>oodness, <b>S</b>ize.<br>
<span class="fr">un <b>beau</b> jardin, une <b>vieille</b> maison, un <b>bon</b> repas, une <b>petite</b> ville</span></p>

<h3>Tu vs Vous</h3>
<table>
<tr><th>Use <span class="fr">tu</span></th><th>Use <span class="fr">vous</span></th></tr>
<tr><td>Friends, family, kids, pets, colleagues you know well</td><td>Strangers, shopkeepers, waiters, anyone older, anyone in authority, any group of people</td></tr>
</table>
<div class="box blue"><b>When in doubt, use vous</b>Being too formal is mildly amusing. Being too casual is genuinely rude. Wait for them to say <span class="fr">on peut se tutoyer</span> ("we can use tu").</div>
`},

{id:"convo", title:"Conversation Starter Kit", sub:"Scripts for the conversations you'll actually have", tag:"Days 6, 13, 20+", body:`
<h3>Meeting someone</h3>
<table>
<tr><td class="fr">Bonjour, je m'appelle Oliver.</td><td>Hello, my name is Oliver.</td></tr>
<tr><td class="fr">Enchanté.</td><td>Nice to meet you.</td></tr>
<tr><td class="fr">Comment vous appelez-vous ?</td><td>What's your name? (formal)</td></tr>
<tr><td class="fr">Je suis américain. / Je viens des États-Unis.</td><td>I'm American. / I'm from the US.</td></tr>
<tr><td class="fr">J'habite à Chicago.</td><td>I live in Chicago.</td></tr>
<tr><td class="fr">Je parle un peu français.</td><td>I speak a little French.</td></tr>
<tr><td class="fr">Qu'est-ce que vous faites dans la vie ?</td><td>What do you do for a living?</td></tr>
<tr><td class="fr">Je travaille dans la santé.</td><td>I work in healthcare.</td></tr>
</table>

<h3>At a café</h3>
<table>
<tr><td class="fr">Bonjour ! Une table pour deux, s'il vous plaît.</td><td>Hi! A table for two, please.</td></tr>
<tr><td class="fr">La carte, s'il vous plaît.</td><td>The menu, please.</td></tr>
<tr><td class="fr">Qu'est-ce que vous recommandez ?</td><td>What do you recommend?</td></tr>
<tr><td class="fr">Je vais prendre le poulet.</td><td>I'll have the chicken.</td></tr>
<tr><td class="fr">Une carafe d'eau, s'il vous plaît.</td><td>A jug of tap water, please. (free)</td></tr>
<tr><td class="fr">C'était très bon, merci.</td><td>That was very good, thank you.</td></tr>
<tr><td class="fr">L'addition, s'il vous plaît.</td><td>The check, please.</td></tr>
</table>

<h3>Small talk that always works</h3>
<table>
<tr><td class="fr">Il fait beau aujourd'hui !</td><td>Nice weather today!</td></tr>
<tr><td class="fr">Vous êtes d'ici ?</td><td>Are you from here?</td></tr>
<tr><td class="fr">C'est ma première fois en France.</td><td>It's my first time in France.</td></tr>
<tr><td class="fr">J'adore cette ville.</td><td>I love this city.</td></tr>
<tr><td class="fr">Qu'est-ce qu'il faut voir ici ?</td><td>What should I see here?</td></tr>
</table>

<h3>Buying time when you're stuck</h3>
<p>These make you sound fluent while your brain catches up. Use them constantly.</p>
<table>
<tr><td class="fr">Alors…</td><td class="say">a-LOR</td><td>So… / Well…</td></tr>
<tr><td class="fr">Euh…</td><td class="say">uh</td><td>Um… (the French "uh")</td></tr>
<tr><td class="fr">Ben…</td><td class="say">bahn</td><td>Well… (very casual)</td></tr>
<tr><td class="fr">Comment dire…</td><td class="say">ko-mahn DEER</td><td>How to say it…</td></tr>
<tr><td class="fr">C'est-à-dire…</td><td class="say">say-ta-DEER</td><td>That is to say…</td></tr>
<tr><td class="fr">Voilà.</td><td class="say">vwa-LA</td><td>There you go. (ends any sentence)</td></tr>
<tr><td class="fr">Je ne sais pas comment on dit…</td><td></td><td>I don't know how you say…</td></tr>
</table>
<div class="box green"><b>The single best learner phrase</b><span class="fr">Comment on dit "___" en français ?</span> — "How do you say ___ in French?" It turns any conversation into a lesson.</div>
`},
];

/* ============================================================
   STATE
   ============================================================ */
const KEY="french-tutor-v1";
let S = load();

function blank(){
  return {startDate:new Date().toISOString().slice(0,10), currentDay:1, completed:{}, quiz:{}, checkpoints:{},
          known:{}, starred:{}, canDo:{}, lastStudy:null, streak:0, notes:"",
          voice:"", rate:0.85, autoplay:true, sessions:[], hw:{}, syncCode:"", updatedAt:""};
}
function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); return r?Object.assign(blank(),r):blank(); }
  catch(e){ return blank(); }
}
function save(){
  S.updatedAt = new Date().toISOString();
  localStorage.setItem(KEY, JSON.stringify(S));
  paintHeader();
  queuePush();
}
function saveLocalOnly(){ localStorage.setItem(KEY, JSON.stringify(S)); paintHeader(); }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const t=todayStr();
  if(S.lastStudy===t) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.lastStudy===y) ? (S.streak||0)+1 : 1;
  S.lastStudy=t;
}
function doneCount(){ return Object.keys(S.completed).filter(k=>S.completed[k]).length }
function knownCount(){ return Object.keys(S.known).filter(k=>S.known[k]).length }
function phaseOf(d){ return PHASES.find(p=>d>=p.days[0]&&d<=p.days[1]) }
function weekOf(d){ return Math.ceil(d/7) }
function dayInfo(d){ const r=PLAN[d-1]; return {n:r[0],title:r[1],desc:r[2]} }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;") }

function paintHeader(){
  document.getElementById("p-day").textContent=S.currentDay;
  document.getElementById("p-streak").textContent=S.streak||0;
  document.getElementById("p-words").textContent=knownCount();
}

/* ============================================================
   AUDIO — French text-to-speech (built into the browser)
   ============================================================ */
const TTS = window.speechSynthesis || null;
let VOICES=[], VOICE=null;

/* Voice lists load asynchronously and some browsers never fire the event,
   so we (re)pick the voice defensively — including right before speaking. */
function loadVoices(){
  if(!TTS) return VOICE;
  const all = TTS.getVoices() || [];
  VOICES = all.filter(v=>v.lang && v.lang.toLowerCase().replace("_","-").startsWith("fr"));
  const nice=["thomas","amélie","amelie","audrey","virginie","marie","aurelie","aurélie","jacques","chantal","nicolas"];
  const junk=/grandma|grandpa|rocko|shelley|sandy|flo|eddy|bubbles|jester|superstar|trinoids|whisper|bells|boing|organ|cellos|zarvox|wobble|bad news|good news/i;
  const good = VOICES.filter(v=>!junk.test(v.name));
  const pool = good.length ? good : VOICES;
  VOICE = pool.find(v=>v.name===S.voice)
       || pool.find(v=>/enhanced|premium|siri|neural/i.test(v.name))
       || pool.find(v=>nice.some(n=>v.name.toLowerCase().includes(n)))
       || pool.find(v=>v.lang.toLowerCase().replace("_","-")==="fr-fr")
       || pool[0] || null;
  return VOICE;
}
if(TTS){
  loadVoices();
  TTS.onvoiceschanged = loadVoices;
  // Safari/Chrome sometimes populate the list silently after load
  [200,600,1500,3000].forEach(ms=>setTimeout(loadVoices, ms));
}

function speak(text){
  if(!TTS || !text) return;
  const t = String(text).replace(/\s+/g," ").replace(/·/g," , ").replace(/[…—–]/g," ").trim();
  if(!t) return;
  if(!VOICE) loadVoices();                 // voices may have arrived since page load
  TTS.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.rate = S.rate || 0.85;
  if(VOICE){
    u.voice = VOICE;
    u.lang  = VOICE.lang;                  // must match the voice or Chrome ignores it
  } else {
    u.lang = "fr-FR";
    warnNoVoice();
  }
  TTS.speak(u);
}
let warned=false;
function warnNoVoice(){
  if(warned) return; warned=true;
  setTimeout(()=>alert(
    "No French voice is available, so your Mac is reading French with an English voice.\n\n"+
    "Fix: System Settings → Accessibility → Spoken Content → System Voice → Manage Voices → "+
    "download a French voice (Thomas is good), then fully quit and reopen your browser."
  ),100);
}
function voiceLabel(){
  if(!TTS) return "";
  if(!VOICE) loadVoices();
  return VOICE ? `${VOICE.name} (${VOICE.lang})` : "none — English fallback";
}
function speakEl(el){
  const c = el.cloneNode(true);
  c.querySelectorAll(".say,.spk,.vbtns").forEach(n=>n.remove());
  el.classList.add("speaking");
  setTimeout(()=>el.classList.remove("speaking"), 900);
  speak(c.textContent);
}
/* click any blue French text anywhere to hear it */
document.addEventListener("click", e=>{
  const b = e.target.closest(".spk");
  if(b){ e.stopPropagation(); speak(b.dataset.t); return; }
  const f = e.target.closest(".fr");
  if(f){ e.stopPropagation(); speakEl(f); }
});
function audioHint(){
  if(!TTS) return `<p class="audio-hint">⚠️ This browser doesn't support speech. Try Safari or Chrome.</p>`;
  const ok = !!VOICE;
  return `<p class="audio-hint">🔊 Tap any <span class="cmd">blue French text</span> to hear it.
    Voice: <b style="color:${ok?'var(--green)':'var(--red)'}">${voiceLabel()}</b>
    <button class="btn ghost sm" style="margin-left:8px" onclick="speak('Bonjour ! Je m\\'appelle Oliver.')">Test</button>
    ${ok?`<br><span style="font-size:12.5px">Wrong voice? Change it in <b>Progress → Audio</b>.</span>`
        :`<br><span style="font-size:12.5px;color:var(--red)">No French voice found — it will read with an English accent. Fix it in <b>Progress → Audio</b>.</span>`}</p>`;
}

/* ============================================================
   QUIZ ENGINE
   Question order AND answer order are shuffled every attempt.
   Types: mc (multiple choice) · type (write it) · listen (hear it)
   ============================================================ */
let QZ=null;

function normAns(x){
  return String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[’‘ʼ]/g,"'")
    .replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim();
}
function prepQ(q){
  const o=Object.assign({},q);
  if(o.a && o.a.length){
    const correct=o.a[o.c||0];
    o.a=shuffle(o.a);
    o.c=o.a.indexOf(correct);
  }
  return o;
}
function passMark(){ return QZ.cp ? 0.75 : 0.8; }
function needed(){ return Math.ceil(QZ.qs.length*passMark()); }

function startQuiz(d){
  const l=LESSONS[d]; if(!l||!l.quiz) return;
  QZ={day:d, qs:shuffle(l.quiz).map(prepQ), i:0, score:0, wrong:[], cp:!!l.isCheckpoint};
  renderQuiz();
}

function renderQuiz(){
  const {qs,i}=QZ;
  if(i>=qs.length) return quizResult();
  const q=qs[i];
  const head=`<div class="eyebrow">${QZ.cp?"Checkpoint · ":""}Question ${i+1} of ${qs.length} · ${QZ.score} right so far</div>
  <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>`;

  if(q.t==="type"){
    modal(`${head}
    <h3 style="margin:12px 0 14px">${q.q}</h3>
    <input type="text" id="tin" placeholder="Type your answer in French…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="muted" style="font-size:13px;margin:7px 0 12px">Accents and punctuation are not required — spelling is.</p>
    <button class="btn" onclick="submitType()">Check answer</button>
    <div id="fb"></div>`);
    const el=document.getElementById("tin");
    el.focus();
    el.onkeydown=e=>{ if(e.key==="Enter") submitType(); };
    return;
  }

  const isListen = q.t==="listen";
  modal(`${head}
  ${isListen?`<div class="card" style="text-align:center;padding:22px;margin:12px 0">
      <div style="font-size:34px;line-height:1">🔊</div>
      <button class="btn" style="margin-top:10px" onclick="speak('${escq(q.play)}')">Play again</button>
      <p class="muted" style="font-size:13px;margin:9px 0 0">Listen as many times as you need.</p>
    </div>`:""}
  <h3 style="margin:12px 0 16px">${q.q}</h3>
  <div id="opts">${q.a.map((a,n)=>`<button class="q-opt" onclick="answer(${n})">${a}</button>`).join("")}</div>
  <div id="fb"></div>`);
  if(isListen) setTimeout(()=>speak(q.play), 260);
}

function submitType(){
  const el=document.getElementById("tin"); if(!el||el.disabled) return;
  const q=QZ.qs[QZ.i];
  const given=normAns(el.value);
  const loose = t=>normAns(t).replace(/'/g,"");
  const right = given.length>0 && q.ans.some(a=>normAns(a)===given || loose(a)===loose(el.value));
  el.disabled=true;
  if(right) QZ.score++; else QZ.wrong.push({q, given:el.value||"(blank)"});
  document.getElementById("fb").innerHTML=
    `<div class="box ${right?"green":"red"}"><b>${right?"Correct":"Not quite — the answer is: "+q.ans[0]}</b>${q.why}</div>
     ${nextBtn()}`;
}

function answer(n){
  const q=QZ.qs[QZ.i], right=n===q.c;
  if(right) QZ.score++; else QZ.wrong.push({q, given:q.a[n]});
  document.querySelectorAll("#opts .q-opt").forEach((b,idx)=>{
    b.onclick=null;
    if(idx===q.c) b.classList.add("right"); else if(idx===n) b.classList.add("wrong");
  });
  document.getElementById("fb").innerHTML=
    `<div class="box ${right?"green":"red"}"><b>${right?"Correct":"Not quite"}</b>${q.why}</div>
     ${nextBtn()}`;
}
function nextBtn(){
  return `<button class="btn" onclick="QZ.i++;renderQuiz()">${QZ.i+1>=QZ.qs.length?"See result":"Next question"}</button>`;
}

function quizResult(){
  const {qs,score,day}=QZ;
  const pct=Math.round(score/qs.length*100);
  const pass=score>=needed();
  S.quiz[day]={score,total:qs.length,pct,date:todayStr()};
  if(QZ.cp) S.checkpoints[day]=pct;
  if(pass){
    S.completed[day]=true; bumpStreak();
    if(S.currentDay===day) S.currentDay=Math.min(90,day+1);
  }
  save();
  const review = QZ.wrong.length? `
    <h3 style="margin:22px 0 10px">What to go back over</h3>
    ${QZ.wrong.map(w=>`<div class="box red"><b>${w.q.q.replace(/<[^>]+>/g,"")}</b>
      <span class="muted">You said: ${w.given}</span><br>${w.q.why}</div>`).join("")}` : "";
  modal(`<h2>${pass?(pct===100?"Perfect score":"Passed"):"Not yet"}</h2>
  <div class="fc" style="min-height:150px;cursor:default">
    <div class="big">${score} / ${qs.length}</div>
    <div class="sub">${pct}% · ${needed()} needed to pass</div>
  </div>
  <div class="box ${pass?"green":"red"}" style="margin-top:16px"><b>${pass?"Day "+day+" is complete":"Day "+day+" stays open"}</b>
  ${pass?`Day ${Math.min(90,day+1)} is unlocked. ${QZ.wrong.length?"Read the notes below before you move on — those are exactly the things that will bite you next week.":"Nothing missed."}`
        :`You need ${needed()} of ${qs.length}. Re-read the lesson and retake it — no penalty, and repeating a day is how this course is designed to work.`}</div>
  ${review}
  <div class="row" style="margin-top:18px">

      return `<button class="chip ${vCat===id?'on':''}" onclick="vCat='${id}';paintVocab()">${e} ${n} ${c}</button>`}).join("")}

    return `<div class="v ${k?'known':''}" onclick="speak('${w}')">
      <span class="vbtns">
        <button class="${k?'on':''}" title="Mark known" onclick="event.stopPropagation();toggleKnown('${w}')">✓</button>
        <button class="${st?'on':''}" title="Star for drilling" onclick="event.stopPropagation();toggleStar('${w}')">★</button>
      </span>
      <span class="fr">${v[0]}</span>
      ${v[1]?`<span class="say">${v[1]}</span>`:""}
      <div class="en">${v[2]}</div>

function escq(s){return s.replace(/'/g,"\\'")}
function toggleKnown(w){ S.known[w]=!S.known[w]; save(); paintVocab(); }
function toggleStar(w){ S.starred[w]=!S.starred[w]; save(); paintVocab(); }

let mode="fc", deck=[], di=0, flipped=false, pCat="all";
let PQ=null;
function paintPractice(){
  document.getElementById("v-practice").innerHTML=`
  <h2 style="margin-bottom:6px">Practice</h2>
  <p class="muted" style="margin-top:0">Flashcards build recognition. The quiz builds recall — which is the harder, more useful one.</p>
  <div class="chips">
    <button class="chip ${mode==='fc'?'on':''}" onclick="mode='fc';buildDeck()">🃏 Flashcards</button>
    <button class="chip ${mode==='qz'?'on':''}" onclick="mode='qz';buildDeck()">✍️ Quiz me</button>
    <button class="chip ${mode==='sp'?'on':''}" onclick="mode='sp';paintPractice()">🗣️ Speaking drills</button>
  </div>
  ${mode==='sp'?speakBox():`
  <div class="chips">
    <button class="chip ${pCat==='all'?'on':''}" onclick="pCat='all';buildDeck()">All words</button>
    <button class="chip ${pCat==='star'?'on':''}" onclick="pCat='star';buildDeck()">★ Starred</button>
    <button class="chip ${pCat==='new'?'on':''}" onclick="pCat='new';buildDeck()">Not yet known</button>
    ${CATS.map(([id,n,e])=>`<button class="chip ${pCat===id?'on':''}" onclick="pCat='${id}';buildDeck()">${e} ${n}</button>`).join("")}
  </div>
  <div id="parea"></div>`}`;
  if(mode!=='sp') buildDeck();
}
function pool(){
  return VOCAB.filter(v=>{
    if(pCat==='star') return S.starred[v[0]];
    if(pCat==='new') return !S.known[v[0]];
    if(pCat!=='all') return v[3]===pCat;
    return true;
  }).filter(v=>v[1]);
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }
function buildDeck(){
  const p=pool();
  const area=document.getElementById("parea"); if(!area) return paintPractice();
  if(p.length<4){ area.innerHTML=`<div class="card"><p style="margin:0">Not enough words in that selection. Pick a bigger category.</p></div>`; return }
  if(mode==='fc'){ deck=shuffle(p); di=0; flipped=false; renderCard(); }
  else { PQ={qs:shuffle(p).slice(0,10), i:0, score:0, pool:p}; renderPQ(); }
  document.querySelectorAll(".chip").forEach(c=>{});
  paintChips();
}
function paintChips(){
  const chips=document.querySelectorAll("#v-practice .chips")[1];
  if(!chips) return;
  [...chips.children].forEach(b=>b.classList.remove("on"));
  const map={all:0,star:1,new:2};
  const idx = map[pCat]!==undefined ? map[pCat] : 3+CATS.findIndex(c=>c[0]===pCat);
  if(chips.children[idx]) chips.children[idx].classList.add("on");
  const m=document.querySelectorAll("#v-practice .chips")[0];
  [...m.children].forEach((b,n)=>b.classList.toggle("on", n===(mode==='fc'?0:mode==='qz'?1:2)));
}
function renderCard(){
  const v=deck[di];
  document.getElementById("parea").innerHTML=`
  <p class="muted" style="font-size:13.5px">Card ${di+1} of ${deck.length} · tap the card to flip${S.autoplay?" · audio plays automatically":""}</p>
  <div class="bar"><i style="width:${(di)/deck.length*100}%"></i></div>
  <div class="fc" onclick="flipped=!flipped;renderCard()">
    ${flipped?`<div class="big">${v[2]}</div><div class="sub"><span class="say">${v[1]}</span></div>
      ${v[4]?`<div class="sub muted" style="margin-top:14px"><i class="fr">${v[4]}</i><br>${v[5]}</div>`:""}
      ${v[6]?`<div class="tip" style="margin-top:10px">💡 ${v[6]}</div>`:""}`
     :`<div class="big">${v[0]}</div><div class="sub muted">tap to reveal</div>`}
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" onclick="event.stopPropagation();speak('${escq(v[0])}')">🔊 Hear it</button>
    <button class="btn ghost" onclick="di=Math.max(0,di-1);flipped=false;renderCard()">← Back</button>
    <button class="btn ghost" onclick="toggleKnown2('${escq(v[0])}')">${S.known[v[0]]?"✓ Known":"Mark known"}</button>
    <button class="btn ghost" onclick="S.starred['${escq(v[0])}']=!S.starred['${escq(v[0])}'];save();renderCard()">${S.starred[v[0]]?"★ Starred":"☆ Star it"}</button>
    <button class="btn" onclick="di=(di+1)%deck.length;flipped=false;renderCard()">Next →</button>
  </div>`;
  if(S.autoplay && !flipped) speak(v[0]);
}
function toggleKnown2(w){ S.known[w]=!S.known[w]; save(); renderCard(); }
function renderPQ(){
  const {qs,i,score}=PQ;
  if(i>=qs.length){
    document.getElementById("parea").innerHTML=`
    <div class="fc" style="min-height:170px"><div class="big">${score} / ${qs.length}</div>
    <div class="sub">${score===qs.length?"Perfect. Move on to a harder category.":score>=qs.length*.8?"Strong. Star the ones you missed and drill those.":"Worth re-reading the vocabulary list for this category before trying again."}</div></div>
    <div class="row" style="margin-top:14px"><button class="btn" onclick="buildDeck()">Go again</button>
    <button class="btn ghost" onclick="mode='fc';buildDeck()">Switch to flashcards</button></div>`;
    return;
  }
  const q=qs[i];
  const wrong=shuffle(PQ.pool.filter(v=>v[0]!==q[0]&&v[2]!==q[2])).slice(0,3);
  const opts=shuffle([q,...wrong]);
  PQ.opts=opts; PQ.right=opts.indexOf(q);
  document.getElementById("parea").innerHTML=`
  <p class="muted" style="font-size:13.5px">Question ${i+1} of ${qs.length} · score ${score}</p>
  <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  <div class="card" style="text-align:center;padding:26px">
    <div style="font-family:Georgia,serif;font-size:29px;color:var(--blue)">${q[0]}</div>
    <button class="btn ghost sm" style="margin-top:12px" onclick="speak('${escq(q[0])}')">🔊 Hear it</button>
  </div>
  <div id="popts" style="margin-top:14px">${opts.map((o,n)=>`<button class="q-opt" onclick="pAnswer(${n})">${o[2]}</button>`).join("")}</div>
  <div id="pfb"></div>`;
  if(S.autoplay) speak(q[0]);
}
function pAnswer(n){
  const right=n===PQ.right, q=PQ.qs[PQ.i];
  if(right)PQ.score++; else S.starred[q[0]]=true, save();
  document.querySelectorAll("#popts .q-opt").forEach((b,idx)=>{b.onclick=null;
    if(idx===PQ.right)b.classList.add("right"); else if(idx===n)b.classList.add("wrong")});
  document.getElementById("pfb").innerHTML=
  `<div class="box ${right?'green':'red'}"><b>${right?"Correct":"Nope — starred it for you"}</b>
   <span class="fr">${q[0]}</span> <span class="say">${q[1]}</span> — ${q[2]}<br>
   ${q[4]?`<i class="fr">${q[4]}</i> — ${q[5]}`:""}</div>
   <button class="btn" onclick="PQ.i++;renderPQ()">${PQ.i+1>=PQ.qs.length?"See score":"Next"}</button>`;
}
function speakBox(){
  return `<div class="card"><h3>Speaking drills</h3>
  <p>Reading French silently teaches you almost nothing. These take 3 minutes and are the highest-value thing in the whole course.</p>
  <ol style="padding-left:20px">
    <li><b>Shadowing.</b> Open the pronunciation sheet, read a line, then say it again <i>faster</i>. Three times each.</li>
    <li><b>Cover and produce.</b> Look at the English column only. Say the French before you look. This is the direction that matters.</li>

function addCp(){
  const d=parseInt(document.getElementById("cpd").value), p=parseInt(document.getElementById("cps").value);
  if(!d||isNaN(p)) return;
  S.checkpoints[d]=p; save(); paintProgress();
}
function exportData(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download="french-progress-"+todayStr()+".json"; a.click();
}
function importData(el){
  const f=el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign(blank(),JSON.parse(r.result)); save(); paintProgress(); alert("Progress restored."); }catch(e){ alert("That file didn't look right.") } };
  r.readAsText(f);
}

/* ============================================================
   MODAL
   ============================================================ */
/* Wide tables are unreadable on a phone, so each row becomes a small
   card and every cell gets its column heading as a label. */
function enhanceTables(root){
  if(!root) return;
  root.querySelectorAll("table").forEach(t=>{
    if(t.dataset.enh) return;
    t.dataset.enh="1";
    t.classList.add("stack");
    const rows=[...t.rows];
    if(!rows.length) return;
    let labels=null;
    if(rows[0].querySelector("th") && !rows[0].querySelector("td")){
      labels=[...rows[0].cells].map(c=>c.textContent.trim());
      rows[0].classList.add("hrow");
      rows.shift();
    }
    rows.forEach(tr=>{
      [...tr.cells].forEach((cell,i)=>{
        if(cell.tagName==="TH"){ cell.classList.add("rowlab"); return; }
        const l=labels && labels[i];
        if(l && l.length && l.length<26) cell.setAttribute("data-l",l);
      });
    });
  });
}

function modal(html){
  const body=document.getElementById("modal-body");
  body.innerHTML=html;
  enhanceTables(body);
  const h=body.querySelector("h2,h3");
  document.getElementById("sheet-title").textContent = h ? h.textContent.trim() : "";
  const ov=document.getElementById("overlay");
  ov.classList.add("on");
  ov.scrollTop=0;
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("overlay").classList.remove("on");
  document.body.style.overflow="";
}
document.getElementById("overlay").onclick=e=>{ if(e.target.id==="overlay") closeModal() };
document.onkeydown=e=>{ if(e.key==="Escape") closeModal() };


/* ============================================================
   THE 20-MINUTE TIMER
   ============================================================ */
const BLOCKS=[
 [0,3,  "Warm-up",   "Rapid recall of yesterday. Say it out loud. No new material."],
 [3,8,  "New words", "5–8 new items. Say each one aloud with its memory hook."],
 [8,13, "Grammar",   "Exactly one rule. Read the examples out loud, not silently."],
 [13,17,"Out loud",  "Speaking drills. This is the block people skip and the one that matters."],
 [17,20,"The test",  "Take the quiz. 80% to unlock tomorrow."]
];
const TOTAL=20*60;
let T={running:false, sec:0, iv:null, open:false, block:-1, day:null};

function fmt(x){ const m=Math.floor(x/60), ss=x%60; return m+":"+String(ss).padStart(2,"0"); }
function blockAt(sec){ const m=sec/60; return BLOCKS.findIndex(b=>m>=b[0]&&m<b[1]); }

function beep(times){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<(times||1);i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=760; o.type="sine";
      const t0=ctx.currentTime+i*0.28;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.28,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.22);
      o.start(t0); o.stop(t0+0.24);
    }
  }catch(e){}
}
let toastT=null;
function toast(msg){
  const el=document.getElementById("toast"); if(!el) return;
  el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove("on"), 3200);
}
/* The clock starts on its own when you begin a NEW lesson.
   Re-reading a lesson you've already finished doesn't start it. */
function autoStartTimer(day){
  if(S.completed[day]) return;               // reviewing old material — no timer
  if(T.running) return;                      // already counting, leave it alone
  if(T.day===day && T.sec>=TOTAL) return;    // already did a full session on this lesson
  if(T.sec>=TOTAL || (T.day!=null && T.day!==day)) resetTimer();
  T.day=day;
  startTimer();
  toast("⏱ 20 minutes started — warm-up");
}
function openTimer(){ T.open=true; paintTimer(); }
function closeTimer(){ T.open=false; paintTimer(); }
function startTimer(){
  if(T.running) return;
  T.running=true;
  T.iv=setInterval(()=>{
    T.sec++;
    const b=blockAt(T.sec);
    if(b!==T.block && b>-1){ T.block=b; if(T.sec>1) beep(1); }
    if(T.sec>=TOTAL) finishTimer();
    paintTimer();
  },1000);
  T.block=blockAt(T.sec);
  paintTimer();
}
function pauseTimer(){ T.running=false; clearInterval(T.iv); paintTimer(); }
function resetTimer(){ pauseTimer(); T.sec=0; T.block=-1; paintTimer(); }
function finishTimer(){
  pauseTimer();
  beep(3);
  logSession(20);
  T.sec=TOTAL; paintTimer();
}
function logSession(mins){
  S.sessions=S.sessions||[];
  S.sessions.push({d:todayStr(), m:mins, i:Math.random().toString(36).slice(2,8)});
  bumpStreak(); save();
}
function studyMinutes(){ return (S.sessions||[]).reduce((a,b)=>a+b.m,0); }
function last7(){
  const cut=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  return (S.sessions||[]).filter(x=>x.d>=cut).reduce((a,b)=>a+b.m,0);
}
function hwDone(){ return Object.keys(S.hw||{}).filter(k=>S.hw[k]).length; }
function hwTotal(){ return Object.keys(LESSONS).reduce((a,d)=>a+((LESSONS[d].homework||[]).length),0); }
function logPartial(){
  const m=Math.round(T.sec/60);
  if(m<1) return;
  logSession(m); resetTimer();
  alert(m+" minute"+(m===1?"":"s")+" logged. Total study time: "+studyMinutes()+" minutes.");
}

function paintTimer(){
  const el=document.getElementById("timer"); if(!el) return;
  const left=Math.max(0,TOTAL-T.sec);
  el.classList.toggle("open",T.open);
  el.classList.toggle("run",T.running);
  if(!T.open){ el.innerHTML=`<span id="tmini">${T.sec?fmt(left):"20:00"}</span>`; return; }
  const bi=blockAt(Math.min(T.sec,TOTAL-1));
  const b=BLOCKS[bi<0?0:bi];
  const done=T.sec>=TOTAL;
  el.innerHTML=`
   <button class="tx" onclick="event.stopPropagation();closeTimer()">×</button>
   <div class="eyebrow" style="text-align:center">${done?"Session complete":"20-minute session"}</div>
   <div class="clock">${fmt(left)}</div>
   <div class="blk">${done?"Nice work — logged":b[2]}</div>
   <div class="blkd">${done?"That is today's 20 minutes done. Total: "+studyMinutes()+" minutes.":b[3]}</div>
   <div class="tsegs">${BLOCKS.map((x,i)=>{
      const segStart=x[0]*60, segEnd=x[1]*60;
      const pct=Math.max(0,Math.min(1,(T.sec-segStart)/(segEnd-segStart)))*100;
      return `<i class="${pct>=100?"done":""}" title="${x[2]}"><b style="width:${pct}%"></b></i>`;
   }).join("")}</div>
   <div class="trow">
     ${done?`<button class="p" onclick="event.stopPropagation();resetTimer()">Start another</button>`
     :`<button class="p" onclick="event.stopPropagation();${T.running?"pauseTimer()":"startTimer()"}">${T.running?"Pause":(T.sec?"Resume":"Start")}</button>
       <button onclick="event.stopPropagation();resetTimer()">Reset</button>`}
   </div>
   ${(!done&&T.sec>60)?`<p class="mini-note"><a href="#" onclick="event.preventDefault();event.stopPropagation();logPartial()">Stop early and log ${Math.round(T.sec/60)} min</a></p>`:""}
   ${(!T.sec)?`<p class="mini-note">Chimes at each block change.</p>`:""}`;
}
